name: Bug report
description: Report a reproducible PatchHive defect.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use sanitized mission data and list the exact steps.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Maintainer impact
    validations:
      required: true
